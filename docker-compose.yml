version: '3.9'

services:
  web:
    build: ./backend
    command: sh -c "python manage.py makemigrations && python manage.py migrate && gunicorn trackit_backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=1

  # Frontend React app is run locally via Vite (see README). The legacy static
  # `frontend` service has been removed to avoid confusion.

volumes:
  postgres_data:
